<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3A5D">
<title>Melhores para vídeo — Drop Certo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#F26A21; --laranja-esc:#c9500f; --azul:#0E3A5D; --teal:#1BA39C;
    --fundo:#EEF2F6; --card:#fff; --texto:#17212c; --texto-2:#566270; --borda:#dde3ea; --raio:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fundo:#0a1119; --card:#131d28; --texto:#eef2f6; --texto-2:#9fb0c0; --borda:#243240; --laranja-esc:#ff8a47; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px}
  header{background:var(--azul);color:#fff;padding:18px 16px 16px}
  .cab{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .marca{font-weight:800;font-size:1.25rem;letter-spacing:-.2px}
  .marca b{color:var(--laranja)}
  #quando{margin:0;font-size:.8rem;opacity:.8;font-variant-numeric:tabular-nums}
  main{max-width:760px;margin:0 auto;padding:16px 14px 48px;display:grid;gap:16px}
  .produto{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--borda);
    border-radius:var(--raio);padding:14px;color:inherit;text-decoration:none}
  .foto{width:132px;height:132px;border-radius:14px;background:#fff;border:1px solid var(--borda);overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:contain;display:block}
  h2{margin:0 0 6px;font-size:1rem;line-height:1.3;font-weight:700;
     display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .descricao{margin:0 0 10px;font-size:.88rem;color:var(--texto-2);line-height:1.45}
  .preco{font-weight:800;font-size:1.35rem;color:var(--laranja-esc);font-variant-numeric:tabular-nums}
  .de{color:var(--texto-2);text-decoration:line-through;font-weight:500;font-size:.85rem;margin-left:8px}
  .vazio{text-align:center;color:var(--texto-2);padding:48px 16px}
  @media (max-width:420px){
    .produto{grid-template-columns:104px 1fr;gap:12px;padding:12px}
    .foto{width:104px;height:104px}
    .preco{font-size:1.2rem}
  }
</style>
</head>
<body>
<header>
  <div class="cab">
    <div class="marca">Drop<b>Certo</b></div>
    <p id="quando"></p>
  </div>
</header>
<main id="lista"><p class="vazio">Carregando…</p></main>

<script src="config.js"></script>
<script>
const cfg = window.LOJAML_CONFIG || {};
const ARQUIVO = cfg.SUPABASE_URL + "/storage/v1/object/public/produtos/robo/roteiros.json?t=" + Date.now();
const el = (tag, attrs, filhos) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else e.setAttribute(k, v); });
  (filhos || []).forEach((f) => f && e.appendChild(f));
  return e;
};

function cartao(p) {
  const foto = (p.fotos || []).find((u) => /^https:\/\//.test(u));
  let descricao = (p.descricao || "").trim();
  if (descricao && !/[.!?]$/.test(descricao)) descricao += ".";
  const seguro = /^https:\/\//.test(p.link || "");
  return el(seguro ? "a" : "article", Object.assign({ class: "produto" }, seguro ? { href: p.link, target: "_blank", rel: "noopener nofollow" } : {}), [
    el("div", { class: "foto" }, [foto ? el("img", { src: foto, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }) : null]),
    el("div", {}, [
      el("h2", { text: p.nome }),
      descricao ? el("p", { class: "descricao", text: descricao }) : null,
      el("div", {}, [el("span", { class: "preco", text: p.preco || "" }), p.de ? el("span", { class: "de", text: p.de }) : null]),
    ]),
  ]);
}

fetch(ARQUIVO, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  const lista = document.getElementById("lista"); lista.textContent = "";
  const itens = d.itens || [];
  if (d.gerado) document.getElementById("quando").textContent = new Date(d.gerado).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  if (!itens.length) { lista.appendChild(el("p", { class: "vazio", text: "Nenhum produto agora." })); return; }
  itens.forEach((p) => lista.appendChild(cartao(p)));
}).catch(() => {
  const lista = document.getElementById("lista"); lista.textContent = "";
  lista.appendChild(el("p", { class: "vazio", text: "Não consegui carregar a lista. Recarregue a página em 1 minuto." }));
});
</script>
</body>
</html>
