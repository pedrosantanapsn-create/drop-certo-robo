name: Robô Drop Certo

on:
  schedule:
    - cron: "*/10 * * * *"   # confere o Telegram a cada 10 minutos (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
    inputs:
      update:
        description: "Mensagem do Telegram (preenchida pelo modo instantâneo)"
        required: false
        default: ""

# Rodadas normais esperam uma pela outra; as do modo instantâneo (com mensagem)
# rodam cada uma no seu grupo, para nenhuma mensagem ser descartada da fila.
concurrency:
  group: ${{ inputs.update != '' && format('robo-msg-{0}', github.run_id) || 'robo-drop-certo' }}
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      UPDATE_JSON: ${{ inputs.update }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      CANAL_ID: ${{ secrets.CANAL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      # Ajustes opcionais (Settings > Secrets and variables > Actions > Variables)
      SUPABASE_TABELA: ${{ vars.SUPABASE_TABELA }}
      SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET }}
      COL_NOME: ${{ vars.COL_NOME }}
      COL_PRECO: ${{ vars.COL_PRECO }}
      COL_IMAGEM: ${{ vars.COL_IMAGEM }}
      COL_LINK: ${{ vars.COL_LINK }}
      COL_DESCRICAO: ${{ vars.COL_DESCRICAO }}
      COL_PRECO_ANTIGO: ${{ vars.COL_PRECO_ANTIGO }}
      AUTO_POSTAR_CANAL: ${{ vars.AUTO_POSTAR_CANAL }}
      AUTO_POSTAR_INSTAGRAM: ${{ vars.AUTO_POSTAR_INSTAGRAM }}
      AUTO_POSTAR_TIKTOK: ${{ vars.AUTO_POSTAR_TIKTOK }}
      ZERNIO_TIKTOK_ACCOUNT: ${{ vars.ZERNIO_TIKTOK_ACCOUNT }}
      ZERNIO_INSTAGRAM_ACCOUNT: ${{ vars.ZERNIO_INSTAGRAM_ACCOUNT }}
      AUTO_STORY_INSTAGRAM: ${{ vars.AUTO_STORY_INSTAGRAM }}
      FOTO_LIMPA: ${{ vars.FOTO_LIMPA }}
      HORARIOS_PICO: ${{ vars.HORARIOS_PICO }}
      MINUTOS_FORA_PICO: ${{ vars.MINUTOS_FORA_PICO }}
      MINUTOS_NO_PICO: ${{ vars.MINUTOS_NO_PICO }}
      SUGERIR_OFERTAS: ${{ vars.SUGERIR_OFERTAS }}
      LOJAS_OFERTAS: ${{ vars.LOJAS_OFERTAS }}
      VOZ_KOKORO: ${{ vars.VOZ_KOKORO }}
      VELOCIDADE_VOZ: ${{ vars.VELOCIDADE_VOZ }}
      ARROBA: ${{ vars.ARROBA }}
      MARCA: ${{ vars.MARCA }}
    steps:
      - name: Tem mensagem nova?
        id: checar
        run: |
          RESPOSTA=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?limit=1&timeout=0")
          # Fila de postagens: horário do próximo post guardado no Supabase
          PROXIMA=$(curl -s "${SUPABASE_URL}/rest/v1/config?chave=eq.fila_proxima&select=valor" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            | grep -o '"valor":"[0-9]*"' | grep -o '[0-9]\+' || true)
          # Relatório semanal: horário do próximo envio (toda segunda às 9h)
          RELATORIO=$(curl -s "${SUPABASE_URL}/rest/v1/config?chave=eq.relatorio_proximo&select=valor" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            | grep -o '"valor":"[0-9]*"' | grep -o '[0-9]\+' || true)
          # Conferência diária das ofertas do site (6h)
          CONFERIR=$(curl -s "${SUPABASE_URL}/rest/v1/config?chave=eq.verificacao_proxima&select=valor" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            | grep -o '"valor":"[0-9]*"' | grep -o '[0-9]\+' || true)
          # Ofertas sugeridas (10h)
          SUGERIR=$(curl -s "${SUPABASE_URL}/rest/v1/config?chave=eq.ofertas_proxima&select=valor" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            | grep -o '"valor":"[0-9]*"' | grep -o '[0-9]\+' || true)
          if [ -n "$UPDATE_JSON" ]; then
            echo "Mensagem recebida pelo modo instantâneo."
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          elif echo "$RESPOSTA" | grep -q '"update_id"'; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROXIMA" ] && [ "$(date +%s)" -ge "$PROXIMA" ]; then
            echo "Hora de postar o próximo da fila."
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELATORIO" ] && [ "$(date +%s)" -ge "$RELATORIO" ]; then
            echo "Hora do relatório semanal."
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUGERIR" ] && [ "$(date +%s)" -ge "$SUGERIR" ]; then
            echo "Hora das ofertas sugeridas."
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          elif [ -n "$CONFERIR" ] && [ "$(date +%s)" -ge "$CONFERIR" ]; then
            echo "Hora da conferência diária do site."
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            [ -n "$PROXIMA" ] && echo "Próximo post da fila: $(TZ=America/Sao_Paulo date -d @"$PROXIMA" '+%d/%m %H:%M')"
            echo "Nenhuma mensagem nova."
            [ -z "$TELEGRAM_TOKEN" ] && echo "AVISO: segredo TELEGRAM_TOKEN vazio ou ausente."
            echo "Resposta do Telegram: $(echo "$RESPOSTA" | head -c 300)"
            WEBHOOK=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getWebhookInfo" | grep -o '"url":"[^"]*"')
            echo "Webhook do bot: ${WEBHOOK:-nenhum}"
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.checar.outputs.tem == 'sim'

      - uses: actions/setup-python@v6
        if: steps.checar.outputs.tem == 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.checar.outputs.tem == 'sim'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter espeak-ng
          pip install -q -r requirements.txt

      # Voz Kokoro (gratuita, roda no próprio robô): o modelo fica guardado no cache
      - name: Modelo da voz (cache)
        if: steps.checar.outputs.tem == 'sim'
        uses: actions/cache@v5
        with:
          path: modelos
          key: kokoro-v1.0

      - name: Baixar modelo da voz (só na 1ª vez)
        if: steps.checar.outputs.tem == 'sim'
        run: |
          mkdir -p modelos
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s modelos/kokoro-v1.0.onnx ] || curl -sSL -o modelos/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s modelos/voices-v1.0.bin ] || curl -sSL -o modelos/voices-v1.0.bin "$base/voices-v1.0.bin"
          ls -la modelos

      - name: Rodar o robô
        if: steps.checar.outputs.tem == 'sim'
        run: python main.py
