name: Teste leitura Amazon/Shopee
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: |
          python - <<'PY'
          import json, time
          from robo import legenda, gemini
          from robo.produto import buscar_produto
          for link in ["https://www.amazon.com.br/dp/B09B8VGCR8", "https://s.shopee.com.br/6V78kTOWiI"]:
              t=time.time()
              p = buscar_produto({"link": link})
              r = legenda.ler_pagina(p.link, p.url_final)
              print(f"::warning title={link[:40]}::{time.time()-t:.0f}s | robo leu: {p.nome[:50]!r} preco={p.preco} bloqueado={p.bloqueado} final={p.url_final[:80]} | gemini: {json.dumps(r, ensure_ascii=False)[:400]}")
          PY
