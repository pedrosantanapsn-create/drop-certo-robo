name: Teste leitura Amazon/Shopee
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: |
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36","Accept-Language":"pt-BR,pt;q=0.9"}
          def w(t,m): print(f"::warning title={t}::{str(m)[:900]}")
          import os
          K=os.environ["GEMINI_API_KEY"]
          ms=requests.get("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",headers={"x-goog-api-key":K},timeout=30).json()
          nomes=[m["name"].split("/")[-1] for m in ms.get("models",[]) if "generateContent" in m.get("supportedGenerationMethods",[]) and "flash" in m["name"]]
          w("modelos", ", ".join(nomes))
          shopee=None
          for fonte in ["https://escorregaopreco.com.br/ofertas/shopee/5562196","https://www.promobit.com.br/oferta/mouse-logitech-g502-lightspeed-16000dpi-wireless-910-005566/"]:
              try:
                  p=requests.get(fonte,headers=UA,timeout=25).text
                  m=re.search(r'https?://(?:[a-z]+\.)?shopee\.com\.br/[^"\'<> ]+',p.replace("\\u002F","/").replace("\\/","/"))
                  if m: shopee=m.group(0); break
              except Exception as e: w("fonte",e)
          w("shopee-link",shopee)
          links={"amazon":"https://www.amazon.com.br/dp/B09B8VGCR8","shopee":shopee}
          for nome,url in links.items():
              if not url: continue
              corpo={"contents":[{"parts":[{"text":f"Abra esta página de produto e responda SÓ com JSON {{\"nome\":...,\"preco\":...,\"preco_antigo\":...,\"imagem\":...}} usando o que está na página (preço em reais no formato 1.299,90; null se não achar): {url}"}]}],
                     "tools":[{"url_context":{}}]}
              for modelo in [n for n in nomes if n in ("gemini-flash-latest","gemini-flash-lite-latest")] or nomes[:2]:
                  import time; time.sleep(2)
                  r=requests.post(f"https://generativelanguage.googleapis.com/v1beta/models/{modelo}:generateContent",headers={"x-goog-api-key":__import__('os').environ["GEMINI_API_KEY"]},json=corpo,timeout=120)
                  try:
                      j=r.json(); txt=j["candidates"][0]["content"]["parts"][0].get("text","")
                      meta=j["candidates"][0].get("urlContextMetadata") or j["candidates"][0].get("url_context_metadata")
                      w(f"{nome} {modelo}", f"{r.status_code} | {txt[:300]} | meta {json.dumps(meta)[:300]}")
                  except Exception as e:
                      w(f"{nome} {modelo}", f"{r.status_code} {r.text[:300]}")
          PY
