name: Teste leitura Amazon/Shopee
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: |
          python - <<'PY'
          import json, time
          from robo import gemini
          for link in ["https://www.amazon.com.br/dp/B09B8VGCR8", "https://s.shopee.com.br/6V78kTOWiI"]:
              try:
                  d, m = gemini.chamar([{"text": "Abra este link e diga em JSON nome e preço do produto: " + link}], ferramentas=[{"url_context": {}}], rodadas=4)
                  c = d["candidates"][0]
                  print(f"::warning title={link[-12:]} {m}::{gemini.texto(d)[:300]!r} | meta={json.dumps(c.get('urlContextMetadata'))[:300]}")
              except Exception as e:
                  print(f"::warning title={link[-12:]}::ERRO {e}")
          PY
