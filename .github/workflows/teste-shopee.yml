name: teste-shopee
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: |
          python - <<'PY'
          from robo import sugestoes, verificador
          try:
              ps = sugestoes.buscar_shopee(["mouse gamer", "headset gamer"], 3, marcar=False)
              msg = sugestoes.mensagem_shopee(ps)
              for linha in msg.split("\n"):
                  if linha.strip(): print("::warning::" + linha[:200])
          except Exception as e:
              print("::warning::ERRO busca %s: %s" % (type(e).__name__, str(e)[:300]))
          try:
              est, p = verificador.situacao("https://s.shopee.com.br/9pf6x8Iuzd")
              print("::warning::verificador %s preco=%s de=%s" % (est, p.preco, p.preco_antigo))
          except Exception as e:
              print("::warning::ERRO verif %s: %s" % (type(e).__name__, str(e)[:300]))
          PY
