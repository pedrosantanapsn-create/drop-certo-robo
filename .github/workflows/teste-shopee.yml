name: teste-shopee
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: |
          python - <<'PY'
          import os, requests
          from urllib.parse import urljoin
          print("::warning::id definido=%s secret definido=%s tam_id=%d" % (bool(os.environ.get("SHOPEE_APP_ID")), bool(os.environ.get("SHOPEE_APP_SECRET")), len(os.environ.get("SHOPEE_APP_ID",""))))
          url="https://s.shopee.com.br/9pf6x8Iuzd"
          for i in range(6):
              try:
                  r=requests.get(url,allow_redirects=False,timeout=20,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"pt-BR"})
              except Exception as e:
                  print("::warning::erro get %s"%e); break
              loc=r.headers.get("Location")
              print("::warning::passo %d status %s url %s -> %s"%(i,r.status_code,url[:150],(loc or "")[:200]))
              if not loc: break
              url=urljoin(url,loc)
          try:
              from robo import shopee
              print("::warning::ids=%s"%(shopee.ids_do_link("https://s.shopee.com.br/9pf6x8Iuzd"),))
              print("::warning::ler=%s"%(str(shopee.ler("https://s.shopee.com.br/9pf6x8Iuzd"))[:300],))
          except Exception as e:
              print("::warning::ERRO %s: %s"%(type(e).__name__,str(e)[:300]))
          PY
