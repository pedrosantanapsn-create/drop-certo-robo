name: Teste da voz Kokoro
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter espeak-ng
          pip install -q -r requirements.txt
      - uses: actions/cache@v5
        with:
          path: modelos
          key: kokoro-v1.0
      - run: |
          mkdir -p modelos
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s modelos/kokoro-v1.0.onnx ] || curl -sSL -o modelos/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s modelos/voices-v1.0.bin ] || curl -sSL -o modelos/voices-v1.0.bin "$base/voices-v1.0.bin"
      - run: |
          python - <<'PY'
          import time
          from pathlib import Path
          from robo import video
          t = time.time()
          a, _ = video.narrar("Achado do dia! Esse fone está com quarenta por cento de desconto.", Path("t.mp3"))
          print(f"::warning title=voz::{video.voz_usada or 'NENHUMA'} em {time.time()-t:.1f}s | {video.motivo_sem_voz}")
          PY
