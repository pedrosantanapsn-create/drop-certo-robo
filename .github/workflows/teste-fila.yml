name: teste-fila
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HORARIOS_PICO: ${{ vars.HORARIOS_PICO }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from robo import fila, relatorio, supabase
          its = fila.itens()
          print("::warning::fila n=%d modo=%s proxima=%s" % (len(its), fila.modo() if hasattr(fila,'modo') else '?', supabase.ler_config('fila_proxima')))
          for i in its[:8]:
              print("::warning::FILA %s | %s" % (i.get("texto","")[:45], i.get("adicionado")))
          for p in relatorio._historico()[-6:]:
              print("::warning::POST %s %s %s" % (datetime.fromtimestamp(p['t'], relatorio.FUSO).strftime('%H:%M'), p.get('link','')[-12:], p.get('nome','')[:30]))
          PY
