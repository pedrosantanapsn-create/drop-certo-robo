name: teste-ml
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json
          from robo import mercadolivre as m
          for cat in ["MLB53838786","MLB23612880"]:
              for cam, par in [(f"/products/{cat}/items", {}), (f"/products/{cat}", {}), ("/sites/MLB/search", {"product_id": cat})]:
                  try:
                      d = m._get(cam, **par)
                      if isinstance(d, dict) and "results" in d:
                          r = d["results"][:1]
                          print("::warning::%s %s OK n=%s primeiro=%s" % (cat, cam, len(d["results"]), json.dumps(r)[:300]))
                      else:
                          print("::warning::%s %s OK chaves=%s bbw=%s status=%s" % (cat, cam, list(d)[:25], json.dumps(d.get("buy_box_winner"))[:150], d.get("status")))
                  except Exception as e:
                      print("::warning::%s %s ERRO %s" % (cat, cam, str(e)[:200]))
          PY
