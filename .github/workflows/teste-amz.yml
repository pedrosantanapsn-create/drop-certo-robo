name: teste-amz
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          from robo import amazon
          for l in ["https://amzn.to/4B2ujM5", "https://www.amazon.com.br/dp/B0G4MD9ZBL", "https://www.amazon.com.br/dp/B0G4MD9ZBL?tag=outro-20"]:
              print("::warning::%s -> %s" % (l[-25:], amazon.conferir_tag(l)))
          PY
