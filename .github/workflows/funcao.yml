name: Publicar função do Supabase

# Publica supabase/functions/telegram-robo sempre que ela muda (ou no botão "Run workflow").
# Precisa do segredo SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Publicar telegram-robo
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN — a função não foi publicada."
            exit 0
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          npx -y supabase@2 functions deploy telegram-robo --project-ref "$REF" --no-verify-jwt
          echo "::notice::Função telegram-robo publicada."
