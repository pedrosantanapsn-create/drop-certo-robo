name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          from robo import mercadolivre as m
          d = m._get("/products/MLB16211422/items")
          it = (d.get("results") or [{}])[0]
          print("::warning::chaves item: " + ",".join(sorted(it.keys())))
          print("::warning::tags=%s deal_ids=%s" % (it.get("tags"), it.get("deal_ids")))
          txt = json.dumps(d).lower()
          print("::warning::tem 'coupon'? %s  'cupom'? %s  'promotion'? %s" % ("coupon" in txt, "cupom" in txt, "promotion" in txt))
          for cam in ["/users/me/coupons", "/seller-promotions/users/me", "/marketplace/coupons"]:
              try:
                  r = m._get(cam); print("::warning::%s OK %s" % (cam, json.dumps(r)[:200]))
              except Exception as e:
                  print("::warning::%s ERRO %s" % (cam, str(e)[:120]))
          PY
