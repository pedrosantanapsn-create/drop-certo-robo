name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: |
          python - > /tmp/s.txt 2>&1 <<'PY'
          from robo import canais
          c = "t.me/ofertasgamer_oficial"
          try:
              print("RESULTADO:", c, "=>", canais.adicionar(c).replace("\n", " | "))
              nome = canais._limpar_nome(c)
              p = canais.ler_canal(nome)
              ex = [o for x in p for o in canais._ofertas_do_post(x)]
              aceitas = [o for o in ex if canais._link_de_loja_afiliada(o.splitlines()[0])]
              print(f"RESULTADO:   {nome}: {len(p)} posts, {len(ex)} ofertas de tecnologia, {len(aceitas)} de loja afiliada. Ex: " + repr((aceitas or ex or [''])[-1][:260]))
          except Exception as e: print("RESULTADO:", c, "ERRO", repr(e)[:200])
          print("RESULTADO: lista final:", canais.lista())
          PY
          grep RESULTADO /tmp/s.txt | head -9 | while read -r l; do echo "::warning::${l:0:900}"; done
