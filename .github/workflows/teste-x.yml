name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          import json, re, requests
          from robo import sugestoes
          for url in ["https://www.promobit.com.br/loja/amazon/", "https://www.promobit.com.br/promocoes/loja/amazon/", "https://www.promobit.com.br/promocoes/informatica/"]:
              ofs = sugestoes._ler_pagina(url)
              amz = [o for o in ofs if "amazon" in str(o.get("storeName","")).lower()]
              print("::warning::%s total=%d amazon=%d" % (url[-30:], len(ofs), len(amz)))
              if amz:
                  o = amz[0]
                  print("::warning::chaves " + ",".join(sorted(o.keys()))[:600])
                  print("::warning::valores " + json.dumps({k: o[k] for k in o if any(x in k.lower() for x in ("link","url","slug","asin","sku","product","id"))})[:600])
          PY
