name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 pillow
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from robo import ranking, sugestoes, supabase
          sugestoes._vistas = lambda: []
          supabase.gravar_config = lambda *a, **k: None
          for pedido in ["fone com dongle até 300", "ssd nvme até 600", "mouse gamer sem fio até 150"]:
              p, t, r = ranking.separar_pedido(pedido)
              itens = ranking.buscar_custo(p, t, r)
              print("::warning::== %s: %d itens" % (pedido, len(itens)))
              for i, it in enumerate(itens, 1):
                  print("::warning::%d. %s | R$%s | %s | %s | %s" % (i, it["nome"][:55], it["preco"], it.get("nota"), it["loja"], it.get("motivo", "-")))
          PY
