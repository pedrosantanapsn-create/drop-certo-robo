name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 pillow
      - run: |
          python - <<'PY'
          import requests
          from robo import awin
          def w(x): print("::warning::" + str(x).replace("\n"," | ")[:950])
          w(f"feed key: {awin.feed_ativo()} token: {awin.ativo()}")
          import csv, io, gzip
          fs = awin.feeds()
          c = requests.get(fs[0]['url'], timeout=120).content
          if c[:2]==b'\x1f\x8b': c=gzip.decompress(c)
          t = c.decode('utf-8','replace')
          d = csv.Sniffer().sniff(t[:5000], delimiters=",;\t|")
          w(f"sniff delim={d.delimiter!r} quote={d.quotechar!r}")
          n=0
          for row in csv.DictReader(io.StringIO(t)):
              if 'ssd' in (row.get('product_name') or '').lower():
                  w(f"{row.get('product_name','')[:40]} | search={row.get('search_price')} | c1={row.get('custom_1')} c2={row.get('custom_2')} c3={row.get('custom_3')}")
                  n+=1
                  if n>=4: break
          PY
