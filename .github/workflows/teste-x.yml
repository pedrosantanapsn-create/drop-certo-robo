name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          from robo import sugestoes, amazon
          sugestoes._vistas = lambda: []
          print("::warning::" + sugestoes.mensagem_amazon(sugestoes.buscar_amazon("", 2)).replace(chr(10), " | ")[:400])
          for p in ["", "ssd"]:
              os_ = sugestoes.buscar_amazon(p, 4)
              print("::warning::[%s] %d ofertas" % (p or "tecnologia", len(os_)))
              for o in os_[:3]:
                  print("::warning::  -%s%% %s R$%s" % (o.get("offerDiscontPercentage"), o["offerTitle"][:50], o["offerPrice"]))
          for l in []:
              print("::warning::%s -> %s" % (l[-30:], amazon.link_com_minha_tag(l)))
          PY
