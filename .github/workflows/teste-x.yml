name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: |
          python - > /tmp/s.txt 2>&1 <<'PY'
          from robo import canais
          for c in ["poisonpromos","ofertasgamer","tjgaming","promocoestjgaming","pelando","promobit","kabum","gatry"]:
              try:
                  p = canais.ler_canal(c)
                  ex = [x for x in p if canais._ofertas_do_post(x)]
                  print(f"RESULTADO: {c}: {len(p)} posts, {len(ex)} com oferta util, {sum(1 for x in p if canais._e_so_cupom(x['texto']))} so cupom, fotos {sum(1 for x in p if x['foto'])}")
                  if ex: print("RESULTADO:   EX:", repr(canais._ofertas_do_post(ex[-1])[0][:330]))
                  elif p: print("RESULTADO:   texto:", repr(p[-1]["texto"][:250]))
              except Exception as e: print("RESULTADO:", c, "ERRO", str(e)[:100])
          PY
          grep RESULTADO /tmp/s.txt | head -10 | while read -r l; do echo "::warning::${l:0:900}"; done
          grep RESULTADO /tmp/s.txt | tail -n +11 | while read -r l; do echo "::notice::${l:0:900}"; done
