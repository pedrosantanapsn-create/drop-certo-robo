name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null
      - run: pip install -q -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from robo import ranking, telegram, instagram, tiktok, relatorio, supabase, video, config
          # 1) marca o primeiro horário (domingo 19h) — isso é de verdade
          ranking.se_for_hora(lambda t: print("::warning::ENVIAR " + t[:200]))
          print("::warning::ranking_proximo=%s" % supabase.ler_config("ranking_proximo"))
          # 2) simulação completa sem publicar nada
          itens = ranking.buscar_produtos("fone bluetooth", 100)
          for i in itens: print("::warning::ITEM %s | R$%s | nota %s | %s vendas | %s" % (i["nome"][:45], i["preco"], i.get("nota"), i.get("vendas"), i["loja"]))
          config.CANAL_ID = ""; config.ADMIN_CHAT_ID = ""
          instagram.ativo = lambda: False; instagram.story_ativo = lambda: False; tiktok.ativo = lambda: False
          relatorio.registrar_post = lambda *a, **k: None
          gravar = supabase.gravar_config; supabase.gravar_config = lambda *a, **k: None
          orig = video.renderizar
          def rend(c, t, p, n="video.mp4"):
              print("::warning::NARRACAO " + t[:400]); r = orig(c, t, p, n); print("::warning::VIDEO %.1fs voz=%s %s" % (video.duracao(r[0]), r[1], video.voz_usada)); return r
          video.renderizar = rend
          ranking.publicar("fone bluetooth", "fones bluetooth", 100, itens, lambda t: print("::warning::FIM " + t.replace(chr(10), " | ")[:300]), reservado=False)
          PY
