name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          def w(x): print("::warning::" + str(x).replace("\n"," | ")[:900])
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36","Accept-Language":"pt-BR"}
          for u in ["https://www.terabyteshop.com.br/sitemap_produto.xml","https://www.terabyteshop.com.br/cupons","https://www.terabyteshop.com.br/"]:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30); b=r.read()
                  t=b.decode('utf-8','replace'); w(f"{u} {r.status} {len(b)} :: {t[:300]}")
                  if 'sitemap' in u:
                      locs=re.findall(r"<loc>([^<]+)</loc>",t); w(f"locs {len(locs)} {locs[:3]}")
                      if locs and 'produto' in locs[0]:
                          r2=urllib.request.urlopen(urllib.request.Request(locs[0],headers=H),timeout=30); t2=r2.read().decode('utf-8','replace')
                          w("produto: "+str(r2.status)+" "+str(re.findall(r'"price"\s*:\s*"?([\d.,]+)',t2)[:3])+" "+str(re.findall(r'<title>([^<]+)',t2)[:1]))
              except Exception as e: w(f"{u} ERRO {e}")
          PY
