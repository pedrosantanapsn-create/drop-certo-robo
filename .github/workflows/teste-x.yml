name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from robo import awin
          def w(x): print("::warning::" + str(x).replace("\n"," | ")[:950])
          for q in ("ssd 1tb", "placa de video", "mouse gamer"):
              try:
                  it = awin.buscar_produtos(q, loja="kabum", limite=4)
                  w(q + ": " + " ; ".join(f"{i['nome'][:45]} R${i['preco']} {i['prazo']}" for i in it))
              except Exception as e: w(f"{q} ERRO {e!r}")
          try: w(awin.mensagem_cupons(awin.cupons())[:600])
          except Exception as e: w(f"cupons ERRO {e!r}")
          PY
