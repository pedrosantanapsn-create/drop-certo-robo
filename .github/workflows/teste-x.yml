name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - > /tmp/saida.txt 2>&1 <<'PY'
          from robo import config, sugestoes, shopee, mercadolivre, awin, marcas
          out=[]
          vistas=set(sugestoes._vistas())
          try:
              d = shopee._consultar('{productOfferV2(keyword:"ssd",limit:3){nodes{itemId productName}}}')
              out.append("shopee simples: " + str(d)[:200])
          except Exception as e: out.append(f"shopee simples ERRO {e!r}"[:300])
          try:
              d = shopee._consultar('{productOfferV2(keyword:"ssd",sortType:2,limit:3){nodes{itemId productName}}}')
              out.append("shopee sort2: " + str(d)[:200])
          except Exception as e: out.append(f"shopee sort2 ERRO {e!r}"[:300])
          try:
              m = sugestoes.buscar_ml(quantas=10, so_marca=True)
              out.append(f"ml so_marca: {len(m)} novos (ja vistos removidos?) " + " ; ".join(str(x.get('nome'))[:35] for x in m[:5]))
              m2 = sugestoes.buscar_ml(quantas=10, so_marca=False)
              out.append(f"ml sem marca: {len(m2)}")
          except Exception as e: out.append(f"ml ERRO {e!r}")
          try:
              tot=0; bons=0; comdesc=0
              for p in config.PALAVRAS_AWIN.split(","):
                  it = awin.buscar_produtos(p.strip(), limite=5); tot+=len(it)
                  comdesc += sum(1 for i in it if i["desconto"]>=10)
                  bons += sum(1 for i in it if i["desconto"]>=10 and (i["marca"] or marcas.conhecida(i["nome"])))
              out.append(f"awin: {tot} achados, {comdesc} com desconto>=10, {bons} com desconto e marca")
          except Exception as e: out.append(f"awin ERRO {e!r}")
          for l in out: print("RESULTADO:", l)
          PY
          grep RESULTADO /tmp/saida.txt | while read -r l; do echo "::warning::${l:0:900}"; done
