name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - > /tmp/s.txt 2>&1 <<'PY'
          import urllib.request, urllib.parse, base64
          class N(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          op = urllib.request.build_opener(N)
          for u in ["https://meli.la/16E2sNg", "https://meli.la/1jkmt89"]:
              url=u
              for _ in range(5):
                  try:
                      r=op.open(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=20); print("RESULTADO: fim", r.status, url[:300]); break
                  except urllib.error.HTTPError as e:
                      loc=e.headers.get("Location")
                      if not loc: print("RESULTADO: sem loc", e.code); break
                      url=urllib.parse.urljoin(url,loc); print("RESULTADO:", url[:700])
                      q=urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
                      for k,v in q.items():
                          if k=="ref":
                              try: print("RESULTADO: ref decod:", base64.b64decode(v[0]+"==")[:400])
                              except Exception as ex: print("RESULTADO: ref nao b64", ex)
          PY
          grep RESULTADO /tmp/s.txt | head -12 | while read -r l; do echo "::warning::${l:0:950}"; done
