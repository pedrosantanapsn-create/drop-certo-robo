name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 pillow
      - run: |
          python - > /tmp/s.txt 2>&1 <<'PY'
          from robo import ajudante
          try:
              s = ajudante.sinal()
              print("RESULTADO: sinal:", s and (s["quando"].isoformat(), s["precisa_login"]), "| ligado:", ajudante.ligado(), "| usado:", ajudante.usado_recentemente(), "| pendentes:", ajudante.pendentes())
              print("RESULTADO: linhas:", [(l["status"], l["loja"]) for l in ajudante._ler({"select": "status,loja", "limit": "20"})])
          except Exception as e: print("RESULTADO: ERRO", repr(e)[:300])
          PY
          grep RESULTADO /tmp/s.txt | while read -r l; do echo "::warning::${l:0:900}"; done
