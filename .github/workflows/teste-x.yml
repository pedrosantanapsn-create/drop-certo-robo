name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import main
          from robo import amazon, mercadolivre, shopee, awin
          def w(x): print("::warning::" + str(x).replace("\n"," | ")[:900])
          a = main._abrir_encurtador("https://aoferta.net/0007WRHC-Amazon"); w("encurtador: " + a[:100])
          w("amazon: " + str(amazon.link_com_minha_tag(a)))
          novo, txt = mercadolivre.link_meu("https://meli.la/1jkmt89"); w(f"ml: {txt} | {novo}")
          if novo:
              o = mercadolivre.ler(novo); w(f"ml nome: {o.get('nome')} preco {o.get('preco')} parecido={main._parecidos('Fonte Asrock Pro 750w 80 Plus Bronze Atx 3.1 Pro-750b', o.get('nome',''))}")
          w("ml proprio: " + str(mercadolivre.matt_do_link("https://meli.la/1jkmt89")))
          w("awin alheio: " + awin.destino_se_for_de_outro("https://www.awin1.com/cread.php?awinmid=17729&awinaffid=111111&ued=https%3A%2F%2Fwww.kabum.com.br%2Fproduto%2F520369"))
          PY
