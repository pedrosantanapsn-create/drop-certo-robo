name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, requests, os
          from robo import sugestoes, quadro, fila, supabase
          # 1) ML (sem marcar como vistas)
          sugestoes._vistas = lambda: []
          supabase_gravar = supabase.gravar_config
          supabase.gravar_config = lambda *a, **k: None
          ps = sugestoes.buscar_ml(["mouse gamer", "monitor"], 4)
          for n in ps:
              print("::warning::ML -%d%% %s | %s -> %s | %s" % (n["desconto"], n["nome"][:40], n["antes"], n["preco"], n["link"]))
          if not ps: print("::warning::ML vazio")
          # 2) Quadro: sobe uma lista de teste e importa sem mexer na fila real
          u=os.environ["SUPABASE_URL"]; k=os.environ["SUPABASE_SERVICE_KEY"]
          h={"apikey":k,"Authorization":f"Bearer {k}","Content-Type":"application/json","x-upsert":"true"}
          r=requests.post(f"{u}/storage/v1/object/produtos/quadro/teste-claude.json",headers=h,data=json.dumps({"itens":[{"link":"https://amzn.to/4B2ujM5","preco":"99,90","foto":"https://exemplo/1.jpg"},{"link":"https://www.amazon.com.br/dp/B0G4MD9ZBL","foto":""}]}))
          print("::warning::upload %s" % r.status_code)
          print("::warning::pendentes %s" % quadro.pendentes())
          fila.ativa = lambda: True
          fila.adicionar = lambda t, f: (print("::warning::FILA " + json.dumps(list(zip(t, f)))) or (len(t), __import__("datetime").datetime.now(), 0))
          quadro.importar(lambda texto: print("::warning::MSG " + texto.replace("\n"," | ")[:300]))
          print("::warning::depois pendentes %s" % quadro.pendentes())
          PY
