name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 pillow
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from robo import top, alertas, sugestoes, relatorio, fila, config
          import robo.top as t
          t.MINIMO = 1
          txt = top.montar()
          print("::warning::TOP " + (txt.replace(chr(10), " | ")[:500] or "(sem produtos hoje)"))
          alertas.avisar = lambda c, x: print("::warning::ALERTA " + x)
          print("::warning::saude problemas=%s" % alertas.checar_saude())
          c = relatorio._cliques(datetime.now(fila.FUSO) - timedelta(days=30)) or []
          print("::warning::cliques 30d=%d pesos=%s" % (len(c), {k: round(v,2) for k, v in sugestoes.pesos_por_palavra(sugestoes._palavras_shopee()).items() if v}))
          PY
