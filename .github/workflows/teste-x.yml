name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          from robo import sugestoes, amazon
          sugestoes._vistas = lambda: []
          for p in ["", "tudo"]:
              os_ = sugestoes.buscar_amazon("" if p == "tudo" else p, 4, so_tecnologia=(p != "tudo"))
              print("::warning::[%s] %d ofertas" % (p or "tecnologia", len(os_)))
              for o in os_[:3]:
                  print("::warning::  -%s%% %s R$%s" % (o.get("offerDiscontPercentage"), o["offerTitle"][:50], o["offerPrice"]))
          for l in ["https://amzn.to/4B2ujM5", "https://www.amazon.com.br/Monitor-Gamer/dp/B0G4MD9ZBL/ref=xyz?th=1", "https://www.amazon.com.br/dp/B0G4MD9ZBL?tag=outro-20", "https://www.amazon.com.br/s?k=mouse"]:
              print("::warning::%s -> %s" % (l[-30:], amazon.link_com_minha_tag(l)))
          PY
