name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - > /tmp/saida.txt 2>&1 <<'PY'
          import time
          from robo import shopee
          campos = shopee.CAMPOS_BUSCA.split()
          for lim in (20, 10, 5):
              for ordem in (2, 5):
                  q='{productOfferV2(keyword:"mouse gamer",sortType:%d,page:1,limit:%d){nodes{itemId}}}' % (ordem, lim)
                  try: shopee._consultar_uma_vez(q); print(f"RESULTADO: lim{lim} ordem{ordem} OK")
                  except Exception as e: print(f"RESULTADO: lim{lim} ordem{ordem} ERRO")
                  time.sleep(1)
          ruins=[]
          for c in campos:
              q='{productOfferV2(keyword:"mouse gamer",limit:5){nodes{itemId %s}}}' % c
              try: shopee._consultar_uma_vez(q)
              except Exception: ruins.append(c)
              time.sleep(0.5)
          print("RESULTADO: campos com erro:", ruins, "de", len(campos))
          PY
          grep "RESULTADO\|Shopee busca" /tmp/saida.txt | head -12 | while read -r l; do echo "::warning::${l:0:900}"; done
