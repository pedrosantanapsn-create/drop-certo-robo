name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: |
          python - <<'PY'
          import time, requests
          from urllib.parse import urljoin
          from robo import reabastecer, fila, supabase, sugestoes, mercadolivre
          # simulação: fila vazia, sem gravar nada de verdade
          gravado = {}
          sugestoes._vistas = lambda: []
          supabase.gravar_config = lambda k, v: gravado.__setitem__(k, v)
          ler = supabase.ler_config
          supabase.ler_config = lambda k: {"valor": str(int(time.time()) - 1)} if k == reabastecer.CHAVE else ler(k)
          fila.itens = lambda: []
          fila.adicionar = lambda t, f=None: (print("::warning::FILA " + " | ".join(x[:70] for x in t)) or (len(t), __import__("datetime").datetime.now(), 0))
          import robo.config as c; c.POSTAR_DAS, c.POSTAR_ATE = 0, 25
          reabastecer.se_for_hora(lambda t: print("::warning::MSG " + t.replace("\n", " | ")[:600]))
          # o link do ML montado leva para o produto com os seus códigos?
          l = mercadolivre.link_afiliado("MLB16211422")
          r = requests.get(l, allow_redirects=False, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
          print("::warning::link ML %s -> %s %s" % (l[-60:], r.status_code, (r.headers.get("Location") or "")[:120]))
          PY
