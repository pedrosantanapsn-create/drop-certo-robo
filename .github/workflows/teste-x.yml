name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - > /tmp/saida.txt 2>&1 <<'PY'
          import time
          from robo import shopee
          res=""
          for k in range(24):
              q='{productOfferV2(keyword:"mouse gamer",limit:5){nodes{itemId}}}'
              try: shopee._consultar_uma_vez(q); res+="1"
              except Exception: res+="0"
              time.sleep(5)
          print("RESULTADO: 24 chamadas a cada 5s:", res)
          res=""
          for k in range(10):
              try: shopee._consultar_uma_vez('mutation{generateShortLink(input:{originUrl:"https://shopee.com.br/product/1012637045/22867312467",subIds:["t"]}){shortLink}}'); res+="1"
              except Exception: res+="0"
              time.sleep(2)
          print("RESULTADO: 10 shortlinks:", res)
          PY
          grep "RESULTADO\|Shopee busca" /tmp/saida.txt | head -12 | while read -r l; do echo "::warning::${l:0:900}"; done
