name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - run: |
          python3 - > /tmp/s.txt 2>&1 <<'PY'
          import os, json, urllib.request, urllib.error
          k = os.environ["GEMINI_API_KEY"]; B = "https://generativelanguage.googleapis.com/v1beta/"
          def chama(url, corpo=None):
              req = urllib.request.Request(url, data=json.dumps(corpo).encode() if corpo else None, headers={"Content-Type": "application/json", "x-goog-api-key": k})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r: return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e: return e.code, {"erro": e.read().decode()[:300].replace("\n", " ")}
          st, d = chama(B + "models?pageSize=200")
          nomes = [m["name"].split("/")[1] for m in d.get("models", [])]
          img = [n for n in nomes if "image" in n or "imagen" in n or "veo" in n]
          print("RESULTADO: modelos de imagem/video:", img)
          for m in [n for n in img if "flash" in n and "image" in n][:4]:
              st, d = chama(B + f"models/{m}:generateContent", {"contents": [{"parts": [{"text": "Foto realista de uma pessoa sorrindo usando fones de ouvido brancos sem fio em um café, vertical 9:16"}]}], "generationConfig": {"responseModalities": ["TEXT", "IMAGE"]}})
              partes = (d.get("candidates") or [{}])[0].get("content", {}).get("parts", []) if st == 200 else []
              tem = any("inlineData" in p for p in partes)
              print("RESULTADO:", m, st, "IMAGEM GERADA" if tem else d.get("erro", str(d)[:200]))
          PY
          grep RESULTADO /tmp/s.txt | head -9 | while read -r l; do echo "::warning::${l:0:900}"; done; grep -v RESULTADO /tmp/s.txt | tail -2 | while read -r l; do echo "::warning::ERR ${l:0:300}"; done
