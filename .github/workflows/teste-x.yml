name: teste-x
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      AWIN_FEED_KEY: ${{ secrets.AWIN_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          python - > /tmp/saida.txt 2>&1 <<'PY'
          from robo import sugestoes
          s = sugestoes.buscar_shopee(quantas=3, so_marca=True, marcar=False)
          print("RESULTADO: shopee so_marca:", len(s), " ; ".join(str(x.get('productName'))[:40] for x in s))
          PY
          grep "RESULTADO\|Shopee busca" /tmp/saida.txt | head -8 | while read -r l; do echo "::warning::${l:0:900}"; done
