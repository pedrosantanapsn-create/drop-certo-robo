name: Teste fontes de ofertas
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36","Accept-Language":"pt-BR,pt;q=0.9"}
          def w(t,m): print(f"::warning title={t}::{m}")
          for nome,url in [("pelando","https://www.pelando.com.br/"),("pelando-rss","https://www.pelando.com.br/api/feeds/deals"),
                           ("pelando-rss2","https://www.pelando.com.br/rss"),("promobit","https://www.promobit.com.br/"),
                           ("promobit-rss","https://www.promobit.com.br/feed/"),("gatry","https://gatry.com/"),
                           ("ml-afiliados","https://www.mercadolivre.com.br/afiliados/hub"),("amazon-ofertas","https://www.amazon.com.br/deals")]:

              try:
                  r=requests.get(url,headers=UA,timeout=25)
                  t=r.text
                  n_poly=t.count("poly-card"); n_price=t.count("andes-money-amount__fraction")
                  m=re.search(r'"items"\s*:\s*\[',t)
                  w(nome,f"status {r.status_code} len {len(t)} poly {n_poly} prices {n_price} desc {t.count('% OFF')} rss {t.count('<item')} ld {t.count('ld+json')} next {t.count('__NEXT_DATA__')} | {t[:150].replace(chr(10),' ')}")
              except Exception as e: w(nome,f"erro {e}")
          PY
