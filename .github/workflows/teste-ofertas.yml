name: Teste fontes de ofertas
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests, re, json
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36","Accept-Language":"pt-BR,pt;q=0.9"}
          def w(t,m): print(f"::warning title={t}::{m}")
          for url in ["https://www.promobit.com.br/","https://www.promobit.com.br/promocoes/informatica/","https://www.promobit.com.br/promocoes/celulares-e-smartphones/"]:
              r=requests.get(url,headers=UA,timeout=25)
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',r.text,re.S)
              if not m: w(url,f"{r.status_code} sem NEXT_DATA"); continue
              d=json.loads(m.group(1))
              pp=d.get("props",{}).get("pageProps",{})
              w(url+" keys", f"{r.status_code} pageProps: {list(pp.keys())[:20]}")
              # achar lista de ofertas
              def acha(o,cam=""):
                  if isinstance(o,list) and o and isinstance(o[0],dict) and any(k in o[0] for k in ("offerTitle","offerPrice","title","price")):
                      return cam,o
                  if isinstance(o,dict):
                      for k,v in o.items():
                          r_=acha(v,cam+"."+k)
                          if r_: return r_
                  if isinstance(o,list):
                      for i,v in enumerate(o[:3]):
                          r_=acha(v,cam+f"[{i}]")
                          if r_: return r_
                  return None
              achado=acha(pp)
              if achado:
                  cam,lista=achado
                  w(url+" lista", f"{cam} n={len(lista)} campos={list(lista[0].keys())[:40]}")
                  w(url+" ex", json.dumps(lista[0],ensure_ascii=False)[:1500])
          PY
