name: Teste sugestoes
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q requests beautifulsoup4 Pillow
      - run: |
          python - <<'PY'
          from robo import sugestoes
          slugs = ["smartphones","celulares-e-smartphones","telefonia","tv-e-video","audio","eletronicos-e-tv","tv-audio-e-video","casa-inteligente","perifericos","notebooks"]
          for s in slugs:
              n = len(sugestoes._ler_pagina(f"https://www.promobit.com.br/promocoes/{s}/"))
              print(f"::warning title={s}::{n}")
          PY
