name: Busca dos seguidores

# Disparado pela função telegram-robo do Supabase quando ALGUÉM (não a dona) manda
# mensagem no privado do bot: responde com as 3 melhores ofertas. Mais leve que o robo.yml
# (sem ffmpeg e sem modelo de voz), para responder rápido.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Mensagem do Telegram"
        required: true

concurrency:
  group: busca-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  busca:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPDATE_JSON: ${{ inputs.update }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_MATT_WORD: ${{ vars.ML_MATT_WORD }}
      ML_MATT_TOOL: ${{ vars.ML_MATT_TOOL }}
      BUSCA_PUBLICA: ${{ vars.BUSCA_PUBLICA }}
      BUSCAS_POR_HORA: ${{ vars.BUSCAS_POR_HORA }}
      BUSCAS_POR_DIA: ${{ vars.BUSCAS_POR_DIA }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -q -r requirements.txt
      - name: Responder
        run: python main.py
