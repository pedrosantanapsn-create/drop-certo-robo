<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; width: 340px; margin: 12px; color: #1b1b1f; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
  button { margin-top: 8px; padding: 7px 12px; border: 0; border-radius: 6px; background: #2a6df4; color: #fff; font: inherit; cursor: pointer; }
  button.sec { background: #e6e8ee; color: #1b1b1f; }
  .caixa { background: #f3f4f8; border-radius: 8px; padding: 8px 10px; margin-top: 10px; word-break: break-word; }
  .peq { font-size: 12px; color: #555; }
</style>
</head>
<body>
  <h1>Drop Certo — Ajudante</h1>
  <div class="caixa" id="estado">Carregando…</div>
  <div class="caixa peq" id="resumo"></div>

  <label for="senha">Senha do ajudante</label>
  <input id="senha" type="password" placeholder="Cole aqui a senha que o Supabase mostrou" autocomplete="off">
  <button id="salvar">Salvar senha</button>

  <label for="url">Testar com um produto do Mercado Livre</label>
  <input id="url" type="text" placeholder="Cole o endereço de um produto">
  <button id="testar" class="sec">Testar agora</button>
  <div class="caixa" id="teste" hidden></div>

  <label for="busca">Testar uma busca (Terabyte ou Amazon)</label>
  <input id="busca" type="text" placeholder="Ex.: ssd 1tb">
  <button id="buscaTera" class="sec">Buscar na Terabyte</button>
  <button id="buscaAmz" class="sec">Buscar na Amazon</button>
  <div class="caixa" id="testeBusca" hidden></div>

  <label>Testar a leitura de cupons</label>
  <button id="cuponsTera" class="sec">Cupons da Terabyte</button>
  <button id="cuponsMl" class="sec">Cupons do Mercado Livre</button>
  <div class="caixa" id="testeCupons" hidden></div>

  <p class="peq">O ajudante só funciona com este navegador aberto e logado na sua conta do Mercado Livre.
  Ele não vê nem guarda a senha do Mercado Livre.</p>
  <script src="painel.js"></script>
</body>
</html>
